<!doctype html>
<!-- Run with pnpm exec vite, then open /tests/dom-text-selection.html. -->
<html lang="en" translate="no">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Text selection regression</title>
		<style>
			body {
				margin: 24px;
				font: 16px/1.75 sans-serif;
			}
			main {
				max-width: 640px;
			}
			li {
				margin-block: 8px;
			}
			table {
				width: 100%;
				border-collapse: collapse;
			}
			th,
			td {
				padding: 8px 16px;
				border: 1px solid #ccc;
				text-align: left;
			}
		</style>
	</head>
	<body>
		<pre id="results">Running…</pre>
		<div id="test-root"></div>
		<main>
			<p id="demo-paragraph">
				三击选中整段，包含<strong>加粗文字</strong>和 <code>inline code</code>。
				这一段会在窄屏上自动换行，但选区应保留整段，而不是只选当前一行。
			</p>
			<ul>
				<li id="demo-list">
					如果你指的是<strong>蓝色高亮范围太大</strong>，这是可以优化的视觉问题。
				</li>
				<li>下一条不应被选中。</li>
			</ul>
			<table>
				<thead>
					<tr>
						<th>状态</th>
						<th>说明</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td id="demo-cell">本次配对已签发授权</td>
						<td>本次访问</td>
					</tr>
					<tr>
						<td>继续认证其他地址</td>
						<td>认证入口</td>
					</tr>
				</tbody>
			</table>
			<div style="padding: 12px; border: 1px solid #ccc; margin-top: 16px">
				<p id="demo-hint" style="margin: 0">回车添加地址</p>
			</div>
		</main>
		<script type="module">
			import { tightenTripleClickSelection } from "../src/lib/dom-text-selection.ts";

			document.addEventListener("mousedown", tightenTripleClickSelection);
			document.addEventListener("mouseup", tightenTripleClickSelection);
			const root = document.querySelector("#test-root");
			const selection = document.getSelection();
			const results = [];
			const cases = [];
			function assert(condition, message) {
				if (!condition) throw new Error(message);
			}
			function test(name, run) {
				cases.push({ name, run });
			}
			function setup(html) {
				root.innerHTML = html;
				return [...root.querySelectorAll("p, li, th, td, input, textarea")];
			}
			function select(start, startOffset, end, endOffset, backward = false) {
				selection.setBaseAndExtent(
					backward ? end : start,
					backward ? endOffset : startOffset,
					backward ? start : end,
					backward ? startOffset : endOffset,
				);
			}
			async function mousedown(target, options = {}) {
				target.dispatchEvent(
					new MouseEvent("mousedown", {
						bubbles: true,
						cancelable: true,
						detail: 3,
						button: 0,
						...options,
					}),
				);
				await new Promise(requestAnimationFrame);
			}
			function endsAt(node, offset) {
				const range = selection.getRangeAt(0);
				assert(
					range.endContainer === node && range.endOffset === offset,
					"incorrect end boundary",
				);
			}

			test("padded settings paragraph excludes the following section", async () => {
				const [first, next] = setup(
					"<section><div style='padding:12px'><p>回车添加地址</p></div></section><section><p>下一块</p></section>",
				);
				select(first.firstChild, 0, next.firstChild, 0);
				await mousedown(first);
				assert(
					selection.toString() === "回车添加地址",
					"selected paragraph separators",
				);
				endsAt(first.firstChild, first.textContent.length);
			});
			test("whole wrapped paragraph keeps bold, inline code and explicit line breaks", async () => {
				const [first, next] = setup(
					"<p style='width:80px'>整段<strong>加粗</strong>和<code>code</code><br>下一行。</p><p>另一个段落</p>",
				);
				select(first, 0, next, 0);
				await mousedown(first.querySelector("strong"));
				const fragment = selection.getRangeAt(0).cloneContents();
				assert(
					fragment.textContent === first.textContent,
					"lost paragraph content",
				);
				assert(
					fragment.querySelector("strong") &&
						fragment.querySelector("code") &&
						fragment.querySelector("br"),
					"lost inline formatting",
				);
				endsAt(first.lastChild, first.lastChild.textContent.length);
			});
			test("list item does not pull in its nested list", async () => {
				setup(
					"<ul><li id='parent'>第一项<strong>加粗</strong><ul><li id='child'>子项</li></ul></li><li>下一项</li></ul>",
				);
				const parent = root.querySelector("#parent");
				const child = root.querySelector("#child");
				select(parent.firstChild, 0, child.firstChild, 0);
				await mousedown(parent.querySelector("strong"));
				assert(selection.toString() === "第一项加粗", "included nested item");
				endsAt(parent.querySelector("strong").firstChild, 2);
			});
			for (const tag of ["td", "th"]) {
				test(`${tag} selection stays inside the cell`, async () => {
					const [first, next] = setup(
						`<table><tbody><tr><${tag}>本次<strong>配对</strong>已签发授权</${tag}><${tag}>相邻单元格</${tag}></tr></tbody></table>`,
					);
					select(first, 0, next, 0);
					await mousedown(first.querySelector("strong"));
					assert(
						selection.toString() === "本次配对已签发授权",
						"included cell separators",
					);
					endsAt(first.lastChild, first.lastChild.textContent.length);
				});
			}
			test("multiple paragraphs in one cell keep native paragraph scope", async () => {
				setup(
					"<table><tbody><tr><td><p id='first'>第一段</p><p id='next'>第二段</p></td></tr></tbody></table>",
				);
				const first = root.querySelector("#first");
				const next = root.querySelector("#next");
				select(first, 0, next, 0);
				await mousedown(first);
				assert(selection.toString() === "第一段", "selected the entire cell");
			});
			test("whitespace DOM nodes do not become range endpoints", async () => {
				const [first, next] = setup(
					"<p>\n <strong>文字</strong> \n</p>\n<p>下一段</p>",
				);
				select(first, 0, next, 0);
				await mousedown(first);
				assert(
					selection.toString() === "文字",
					"retained formatting whitespace",
				);
				assert(
					selection.anchorNode === first.querySelector("strong").firstChild,
					"incorrect start boundary",
				);
			});
			test("backward triple-click drag preserves all paragraphs and direction", async () => {
				const [first, second, next] = setup(
					"<p>第一段</p><p>第二段</p><p>下一段</p>",
				);
				select(first, 0, next, 0, true);
				await mousedown(first);
				assert(
					selection.toString().replace(/\s/g, "") === "第一段第二段",
					"lost dragged paragraphs",
				);
				assert(
					selection.anchorNode === second.firstChild &&
						selection.focusNode === first.firstChild,
					"lost backward direction",
				);
			});
			test("partial text endpoints are preserved", async () => {
				const [first, second] = setup("<p>abcdef</p><p>ghijkl</p>");
				select(first.firstChild, 2, second.firstChild, 3);
				await mousedown(second);
				assert(
					selection.anchorOffset === 2 && selection.focusOffset === 3,
					"expanded partial endpoints",
				);
			});
			test("a range within a single text node is retained", async () => {
				const [first] = setup("<p>整段文字</p>");
				select(first.firstChild, 0, first.firstChild, 4);
				await mousedown(first);
				assert(
					selection.toString() === "整段文字",
					"lost single-node selection",
				);
			});
			for (const options of [
				{ detail: 1 },
				{ detail: 2 },
				{ detail: 0 },
				{ button: 2 },
				{ shiftKey: true },
				{ ctrlKey: true },
				{ altKey: true },
				{ metaKey: true },
			]) {
				test(`ordinary selection is untouched: ${JSON.stringify(options)}`, async () => {
					const [first, next] = setup("<p>第一段</p><p>下一段</p>");
					select(first, 0, next, 0);
					await mousedown(first, options);
					endsAt(next, 0);
				});
			}
			for (const wrapper of [
				"<pre><p>code\n</p></pre>",
				"<div contenteditable='true'><p>编辑文字</p></div>",
				"<button><p>按钮文字</p></button>",
				"<div class='xterm'><p>终端文字</p></div>",
			]) {
				test(`native control selection is untouched: ${wrapper}`, async () => {
					const [first, next] = setup(`${wrapper}<p>下一段</p>`);
					select(first, 0, next, 0);
					const before = selection.getRangeAt(0).cloneRange();
					await mousedown(first);
					const after = selection.getRangeAt(0);
					assert(
						after.startContainer === before.startContainer &&
							after.startOffset === before.startOffset &&
							after.endContainer === before.endContainer &&
							after.endOffset === before.endOffset,
						"changed native control selection",
					);
				});
			}
			for (const tag of ["input", "textarea"]) {
				test(`${tag} mousedown does not replace document selection`, async () => {
					const [first, control, next] = setup(
						`<p>第一段<${tag}></${tag}></p><p>下一段</p>`,
					);
					select(first, 0, next, 0);
					await mousedown(control);
					endsAt(next, 0);
				});
			}
			test("collapsed and empty selections are untouched", async () => {
				const [first] = setup("<p>文字</p>");
				select(first.firstChild, 1, first.firstChild, 1);
				await mousedown(first);
				assert(
					selection.isCollapsed && selection.anchorOffset === 1,
					"changed caret",
				);
				selection.removeAllRanges();
				await mousedown(first);
				assert(selection.rangeCount === 0, "created a range");
			});
			test("whitespace-only selections are untouched", async () => {
				const [first] = setup("<p>   </p>");
				select(first, 0, first, 1);
				await mousedown(first);
				endsAt(first, 1);
			});

			test("headings are tightened like paragraphs", async () => {
				setup("<h2>标题</h2><p>下一段</p>");
				const heading = root.querySelector("h2");
				const next = root.querySelector("p");
				select(heading, 0, next, 0);
				await mousedown(heading);
				assert(selection.toString() === "标题", "included heading separator");
			});
			test("canceled mousedown is untouched", async () => {
				const [first, next] = setup("<p>第一段</p><p>下一段</p>");
				select(first, 0, next, 0);
				first.addEventListener("mousedown", (event) => event.preventDefault(), {
					once: true,
				});
				await mousedown(first);
				endsAt(next, 0);
			});
			test("drag from a code block into prose is untouched", async () => {
				setup("<pre>code\n</pre><p>下一段</p>");
				const code = root.querySelector("pre");
				const next = root.querySelector("p");
				select(code, 0, next.firstChild, 2);
				const before = selection.getRangeAt(0).cloneRange();
				await mousedown(next);
				assert(
					selection.getRangeAt(0).startContainer === before.startContainer,
					"changed code boundary",
				);
			});
			test("non-prose mousedown is untouched", async () => {
				setup("<div>文字</div><p>下一段</p>");
				const first = root.querySelector("div");
				const next = root.querySelector("p");
				select(first, 0, next, 0);
				await mousedown(first);
				endsAt(next, 0);
			});

			test("native third press is tightened before mouse release", async () => {
				const [first, next] = setup("<p>第一段</p><p>下一段</p>");
				selection.collapse(first.firstChild, 1);
				first.dispatchEvent(
					new MouseEvent("mousedown", { bubbles: true, detail: 3, button: 0 }),
				);
				// Simulate the native default action after mousedown dispatch.
				select(first, 0, next, 0);
				await new Promise(requestAnimationFrame);
				assert(
					selection.toString() === "第一段",
					"old highlight remained until mouseup",
				);
				endsAt(first.firstChild, first.textContent.length);
			});
			test("mouseup still tightens the endpoint after a triple-click drag", async () => {
				const [first, second, next] = setup(
					"<p>第一段</p><p>第二段</p><p>下一段</p>",
				);
				select(first, 0, next, 0);
				second.dispatchEvent(
					new MouseEvent("mouseup", { bubbles: true, detail: 3, button: 0 }),
				);
				await new Promise(requestAnimationFrame);
				endsAt(second.firstChild, second.textContent.length);
				assert(
					selection.toString().replace(/\s/g, "") === "第一段第二段",
					"lost drag content",
				);
			});

			for (const { name, run } of cases) {
				try {
					await run();
					results.push(`PASS ${name}`);
				} catch (error) {
					results.push(`FAIL ${name}: ${error.message}`);
				}
			}
			selection.removeAllRanges();
			root.remove();
			document.querySelector("#results").textContent = results.join("\n");
			const failed = results.filter((result) => result.startsWith("FAIL"));
			document.body.dataset.testStatus = failed.length ? "failed" : "passed";
			document.title = `Text selection regression · ${failed.length ? "FAIL" : "PASS"} (${results.length})`;
		</script>
	</body>
</html>
