<!doctype html>
<!-- Run with pnpm exec vite, then open /tests/browser/chat-markdown-images.html. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Chat Markdown images regression</title>
		<style>
			#results {
				white-space: pre-wrap;
				overflow-wrap: anywhere;
			}
		</style>
	</head>
	<body>
		<pre id="results">Running…</pre>
		<div id="root" style="max-width: 720px; margin: 16px"></div>
		<script type="module">
			import "../../src/index.css";
			import { createElement, Suspense } from "react";
			import { createRoot } from "react-dom/client";
			import { ChatMarkdown } from "../../src/components/chat/chat-markdown.tsx";
			import { ChatMarkdownImageScopeProvider } from "../../src/components/chat/chat-markdown-image.tsx";
			import { ChatImageLightbox } from "../../src/components/chat/chat-image-viewer.tsx";
			import { initializeI18n } from "../../src/i18n/index.ts";

			await initializeI18n("en-US");
			const reads = [];
			const retryCounts = new Map();
			const updatedProjects = new Set();
			const canvas = document.createElement("canvas");
			canvas.width = canvas.height = 2;
			const context = canvas.getContext("2d");
			context.fillStyle = "red";
			context.fillRect(0, 0, 2, 2);
			const updatedBlob = await new Promise((resolve) =>
				canvas.toBlob(resolve),
			);
			const updatedBytes = new Uint8Array(await updatedBlob.arrayBuffer());
			const bytes = new Uint8Array(
				await (await fetch("/assets/branding/icon.png")).arrayBuffer(),
			);
			const readImage = async (projectId, path) => {
				reads.push([projectId, path]);
				if (path === "retry.png") {
					const count = (retryCounts.get(projectId) ?? 0) + 1;
					retryCounts.set(projectId, count);
					if (count === 1) throw new Error("Image is not ready yet");
				}
				return updatedProjects.has(projectId) ? updatedBytes : bytes;
			};
			const markdown = [
				"Text before the screenshot.",
				"![Page](./screenshots/page.png)",
				"Text after the screenshot.",
				"![Retry](retry.png)",
				"![Blocked](../outside.png)",
			].join("\n\n");
			function section(id, width) {
				return createElement(
					"section",
					{ id, style: { width, maxWidth: "100%", marginBottom: 24 } },
					createElement("h2", null, id),
					createElement(
						ChatMarkdownImageScopeProvider,
						{ scope: { projectId: id, sessionKey: "test", readImage } },
						createElement(ChatMarkdown, { text: markdown }),
					),
				);
			}
			createRoot(document.querySelector("#root")).render(
				createElement(
					Suspense,
					{ fallback: "Loading…" },
					section("desktop", 680),
					section("webui-mobile", 320),
					createElement(ChatImageLightbox),
				),
			);
			function assert(condition, message) {
				if (!condition) throw new Error(message);
			}
			async function until(check) {
				const deadline = performance.now() + 15000;
				while (!check()) {
					if (performance.now() > deadline) throw new Error("Timed out");
					await new Promise(requestAnimationFrame);
				}
			}
			try {
				for (const id of ["desktop", "webui-mobile"]) {
					await until(() => document.querySelector(`#${id} button[title]`));
					const section = document.querySelector(`#${id}`);
					const button = section.querySelector(
						'button[title="screenshots/page.png"]',
					);
					button.scrollIntoView();
					await until(() => button.querySelector("img")?.naturalWidth > 0);
					assert(
						button.querySelector("img").src.startsWith("blob:"),
						"Not a Blob URL",
					);
					assert(
						section.textContent.includes("Text after"),
						"Lost surrounding text",
					);
					assert(
						section.textContent.includes("Image unavailable"),
						"Traversal not blocked",
					);
					assert(
						section.scrollWidth <= section.clientWidth,
						"Narrow layout overflow",
					);
					button.click();
					await until(
						() =>
							document.querySelector('[role="dialog"] img')?.naturalWidth > 0,
					);
					assert(
						document.querySelector('[role="dialog"] a[download]'),
						"No save action",
					);
					document
						.querySelector('[role="dialog"] button[aria-label="Close"]')
						.click();
					await until(() => !document.querySelector('[role="dialog"]'));
					const retry = section.querySelector('button[title="retry.png"]');
					retry.scrollIntoView();
					await until(() => retry.textContent.includes("Failed to load"));
					retry.click();
					await until(() => retry.querySelector("img")?.naturalWidth > 0);

					updatedProjects.add(id);
					const nextReply = document.createElement("div");
					section.append(nextReply);
					createRoot(nextReply).render(
						createElement(
							ChatMarkdownImageScopeProvider,
							{ scope: { projectId: id, sessionKey: "test", readImage } },
							createElement(ChatMarkdown, {
								text: "![Updated page](./screenshots/page.png)",
							}),
						),
					);
					nextReply.scrollIntoView();
					await until(() => nextReply.querySelector("img")?.naturalWidth > 0);
					assert(
						nextReply.querySelector("img").naturalWidth === 2,
						"New reply reused the overwritten screenshot",
					);
					assert(
						(await fetch(button.querySelector("img").src)).ok,
						"New reply revoked the earlier image URL",
					);
				}
				assert(
					!reads.some(([, path]) => path.includes("..")),
					"Unsafe path reached reader",
				);
				assert(
					reads.filter(([, path]) => path === "screenshots/page.png").length ===
						4,
					"Unexpected duplicate reads",
				);

				const externalUrl = new URL("/assets/branding/icon.png", location.href);
				externalUrl.hostname =
					location.hostname === "localhost" ? "127.0.0.1" : "localhost";
				const externalReply = document.createElement("div");
				externalReply.id = "external-reply";
				document.querySelector("#root").append(externalReply);
				createRoot(externalReply).render(
					createElement(ChatMarkdown, {
						text: `![External image](${externalUrl.href})`,
					}),
				);
				externalReply.scrollIntoView();
				await until(() => externalReply.querySelector("img")?.naturalWidth > 0);
				externalReply.querySelector("button").click();
				await until(
					() => document.querySelector('[role="dialog"] img')?.naturalWidth > 0,
				);
				const externalAction = document.querySelector('[role="dialog"] a');
				assert(
					!externalAction.hasAttribute("download"),
					"Invalid cross-origin download",
				);
				assert(
					externalAction.target === "_blank",
					"External action replaces workspace",
				);
				assert(
					externalAction.rel.includes("noopener") &&
						externalAction.rel.includes("noreferrer"),
					"Unsafe external action",
				);
				assert(
					externalAction.getAttribute("aria-label") ===
						"Open original image (new tab)",
					"External action is mislabeled as save",
				);
				document.body.dataset.testStatus = "passed";
				document.querySelector("#results").textContent =
					"PASS: desktop + mobile inline images, lightbox/save, retry, path safety, overwritten screenshots, external image action";
			} catch (error) {
				document.body.dataset.testStatus = "failed";
				document.querySelector("#results").textContent =
					`FAIL: ${error.message}`;
				throw error;
			}
		</script>
	</body>
</html>
