<!doctype html>
<!-- Run with pnpm exec vite, then open /tests/browser/chat-column-alignment.html.
     Check at 320, 390, 640, 768, 1023, 1024 and 1440px viewport widths. -->
<html lang="en" translate="no">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Chat column alignment regression</title>
	</head>
	<body>
		<pre id="results">Running…</pre>
		<div id="root"></div>
		<script type="module">
			import "../../src/index.css";
			import { createElement as h, useRef } from "react";
			import { createRoot } from "react-dom/client";
			import { ConversationColumn } from "../../src/components/chat/chat-conversation-column.tsx";
			import { ChatComposerSurface } from "../../src/components/chat/chat-composer-frame.tsx";
			import { UserMessage } from "../../src/components/chat/chat-user-message.tsx";
			import { useScrollbarGutterWidth } from "../../src/components/chat/use-scrollbar-gutter.ts";
			import { useMediaQuery } from "../../src/remote/remote-app-model.ts";
			import { PreferencesProvider } from "../../src/lib/preferences-provider.tsx";
			import { TooltipProvider } from "../../src/ui/tooltip.tsx";
			import { initializeI18n } from "../../src/i18n/index.ts";

			await initializeI18n("en-US");
			const root = createRoot(document.getElementById("root"));
			function Layout({ remote, overflowing }) {
				const scrollRef = useRef(null);
				const gutter = useScrollbarGutterWidth(scrollRef);
				const narrow = useMediaQuery("(max-width: 1023px)");
				return h(
					"main",
					{
						className: "@container",
						"data-remote-webui": remote ? "" : undefined,
					},
					h(
						"div",
						{
							ref: scrollRef,
							className: "chat-scrollbar overflow-y-auto",
							style: { height: 192 },
							tabIndex: 0,
						},
						h(
							ConversationColumn,
							null,
							h("div", { id: "reply" }, "Assistant reply"),
						),
						h(UserMessage, {
							recordRender: false,
							message: {
								id: "user",
								role: "user",
								text: overflowing ? "Message\n".repeat(100) : "Message",
							},
						}),
					),
					h(
						"div",
						{
							id: "composer",
							style: { paddingRight: remote && narrow ? 0 : gutter },
						},
						h(
							ConversationColumn,
							null,
							h(ChatComposerSurface, null, "Composer"),
						),
					),
				);
			}
			function assert(condition, message) {
				if (!condition) throw new Error(message);
			}
			function aligned(a, b, label) {
				assert(Math.abs(a - b) <= 1, `${label}: ${a} vs ${b}`);
			}
			async function settle() {
				for (let frame = 0; frame < 6; frame++)
					await new Promise(requestAnimationFrame);
			}
			try {
				for (const remote of [true, false]) {
					for (const overflowing of [false, true]) {
						document.documentElement.toggleAttribute(
							"data-remote-webui",
							remote,
						);
						root.render(
							h(
								PreferencesProvider,
								null,
								h(TooltipProvider, null, h(Layout, { remote, overflowing })),
							),
						);
						await settle();
						const label = `${innerWidth}px / remote=${remote} / overflowing=${overflowing}`;
						const viewport = document.querySelector(".chat-scrollbar");
						const reply = document
							.getElementById("reply")
							.getBoundingClientRect();
						const bubble = document
							.querySelector(".rounded-bubble")
							.getBoundingClientRect();
						const composer = document
							.querySelector("#composer .pilo-composer-layout")
							.getBoundingClientRect();
						aligned(reply.left, composer.left, `${label}: reply left`);
						aligned(reply.right, composer.right, `${label}: reply right`);
						aligned(
							bubble.right,
							composer.right,
							`${label}: user bubble right`,
						);
						if (remote && innerWidth <= 1023) {
							const main = document
								.querySelector("main")
								.getBoundingClientRect();
							aligned(
								composer.left - main.left,
								main.right - composer.right,
								`${label}: symmetric spacing`,
							);
							assert(
								viewport.offsetWidth === viewport.clientWidth,
								`${label}: no message-only gutter`,
							);
							// Overlay-scrollbar systems can mask the bug in geometry alone.
							const style = getComputedStyle(viewport);
							assert(
								style.scrollbarGutter === "auto" &&
									style.scrollbarWidth === "none",
								`${label}: no classic scrollbar reservation`,
							);
						} else {
							assert(
								getComputedStyle(viewport).scrollbarGutter === "stable",
								`${label}: preserve desktop gutter`,
							);
						}
						assert(
							viewport.scrollWidth <= viewport.clientWidth,
							`${label}: no horizontal overflow`,
						);
						if (overflowing) {
							viewport.scrollTop = 40;
							assert(
								viewport.scrollTop === 40,
								`${label}: native scrolling remains available`,
							);
						}
					}
				}
				document.body.dataset.testStatus = "passed";
				document.getElementById("results").textContent =
					`PASS at ${innerWidth}px: reply and bubble align with composer; symmetric mobile margins; native scrolling; unchanged desktop gutter.`;
			} catch (error) {
				document.body.dataset.testStatus = "failed";
				document.getElementById("results").textContent = error.stack;
				throw error;
			}
		</script>
	</body>
</html>
