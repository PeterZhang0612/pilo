<!doctype html>
<!-- Run with pnpm exec vite, then open /tests/browser/chat-streaming-status.html. -->
<html lang="en" translate="no">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Streaming status layout regression</title>
	</head>
	<body>
		<pre id="results">Running…</pre>
		<div id="root"></div>
		<script type="module">
			import "../../src/index.css";
			import { createElement as h } from "react";
			import { createRoot } from "react-dom/client";
			import { Virtualizer } from "virtua";
			import { AssistantMessage } from "../../src/components/chat/chat-message.tsx";
			import { ChatExpansionStateProvider } from "../../src/components/chat/chat-expansion-state.tsx";
			import { PreferencesProvider } from "../../src/lib/preferences-provider.tsx";
			import { TooltipProvider } from "../../src/ui/tooltip.tsx";
			import { initializeI18n } from "../../src/i18n/index.ts";

			await initializeI18n("en-US");
			const root = createRoot(document.getElementById("root"));
			function render(width, virtualized, following, lines = 8, text = null) {
				document.documentElement.toggleAttribute(
					"data-remote-webui",
					width === 320,
				);
				const message = {
					id: "running",
					role: "assistant",
					text: text ?? "",
					streaming: true,
					content:
						text !== null
							? [{ id: "text", type: "text", text }]
							: [
									{
										id: "first-tool",
										type: "tool",
										toolName: "bash",
										args: { command: "printf 'tool output'" },
										result: {
											content: [
												{ type: "text", text: "tool output\n".repeat(lines) },
											],
										},
										status: "complete",
									},
									{
										id: "second-tool",
										type: "tool",
										toolName: "bash",
										args: { command: "sleep 10" },
										status: "running",
									},
								],
				};
				const renderMessage = () => h(AssistantMessage, { message });
				root.render(
					h(
						PreferencesProvider,
						null,
						h(
							TooltipProvider,
							null,
							h(
								ChatExpansionStateProvider,
								{ key: `${width}:${virtualized}:${following}` },
								h(
									"div",
									{
										className: "chat-scrollbar overflow-y-auto",
										"data-chat-following": following ? "" : undefined,
										style: { width, maxWidth: "100%", height: 180 },
									},
									virtualized
										? h(Virtualizer, { data: [message] }, renderMessage)
										: renderMessage(),
								),
							),
						),
					),
				);
			}
			function assert(condition, message) {
				if (!condition) throw new Error(message);
			}
			async function settle() {
				for (let frame = 0; frame < 4; frame++)
					await new Promise(requestAnimationFrame);
			}
			async function waitForReply(paragraphs) {
				const deadline = performance.now() + 5000;
				// The first Markdown render can suspend beyond a fixed frame budget.
				while (
					document.querySelectorAll(
						'[data-chat-search-content-id="text"] .markdown-renderer p',
					).length !== paragraphs
				) {
					assert(
						performance.now() < deadline,
						`Expected ${paragraphs} rendered reply paragraphs`,
					);
					await new Promise(requestAnimationFrame);
				}
				await settle();
			}
			function checkLayout(label) {
				const status = document.querySelector("[data-chat-streaming-status]");
				const work = status.previousElementSibling;
				assert(
					status.getBoundingClientRect().top >=
						work.getBoundingClientRect().bottom,
					`${label}: status must follow all work, never overlap it`,
				);
				const viewport = document.querySelector(".chat-scrollbar");
				assert(
					viewport.scrollWidth <= viewport.clientWidth,
					`${label}: no horizontal overflow`,
				);
				return status.getBoundingClientRect().top;
			}
			try {
				for (const width of [680, 320]) {
					for (const virtualized of [false, true]) {
						for (const following of [true, false]) {
							const label = `${width}px / virtualized=${virtualized} / following=${following}`;
							render(width, virtualized, following);
							await settle();
							const collapsedTop = checkLayout(label);
							const tool = [...document.querySelectorAll("button")].find(
								(button) => button.classList.contains("group/tool"),
							);
							tool.click();
							await settle();
							assert(
								document.querySelector("pre.scrollbar-pro"),
								`${label}: details expanded`,
							);
							assert(
								checkLayout(label) > collapsedTop + 40,
								`${label}: status moves with expansion`,
							);
							render(width, virtualized, following, 12);
							await settle();
							checkLayout(`${label}: output grows`);
							tool.click();
							await settle();
							assert(
								!document.querySelector("pre.scrollbar-pro"),
								`${label}: details collapsed`,
							);
							assert(
								Math.abs(checkLayout(label) - collapsedTop) <= 1,
								`${label}: status returns after collapse`,
							);
							render(width, virtualized, following, 8, "Streaming reply.");
							await waitForReply(1);
							const shortTextTop = checkLayout(`${label}: short reply`);
							render(
								width,
								virtualized,
								following,
								8,
								"Streaming reply.\n\n".repeat(24),
							);
							await waitForReply(24);
							assert(
								checkLayout(`${label}: reply grows without interaction`) >
									shortTextTop + 40,
								`${label}: status moves with streamed text`,
							);
						}
					}
				}
				document.body.dataset.testStatus = "passed";
				document.getElementById("results").textContent =
					"PASS: status follows expanded/collapsed tool details, growing output and streamed text in plain/virtualized desktop and narrow layouts, following and reading";
			} catch (error) {
				document.body.dataset.testStatus = "failed";
				document.getElementById("results").textContent = error.stack;
				throw error;
			}
		</script>
	</body>
</html>
