<!doctype html>
<!-- Run with pnpm exec vite, then open /tests/browser/cache-keep-alive.html. -->
<html lang="zh-CN" translate="no">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Cache keep-alive notice regression</title>
	</head>
	<body>
		<pre id="results">Running…</pre>
		<div id="root"></div>
		<script type="module">
			import "../../src/index.css";
			import { createElement as h } from "react";
			import { createRoot } from "react-dom/client";
			import { CacheKeepAliveNotice } from "../../src/components/chat/cache-keep-alive-notice.tsx";
			import { initializeI18n } from "../../src/i18n/index.ts";

			await initializeI18n("zh-CN");
			const root = createRoot(document.getElementById("root"));
			const status = {
				ready: true,
				status: "scheduled",
				reason: "warmed",
				provider: "mock",
				modelId: "model",
				expiresAtMs: 1000000,
				nextWarmAtMs: 900000,
				requestCount: 1,
				inputTokens: 2,
				cacheReadTokens: 998,
				cacheWriteTokens: 0,
				outputTokens: 1,
				cost: 0.000323,
			};
			const views = ["desktop", "webui-mobile"];
			function render(sessionKey, current = status) {
				root.render(
					h(
						"div",
						null,
						...views.map((id) =>
							h(
								"section",
								{ key: id, id, style: { width: id === "desktop" ? 680 : 320 } },
								h(CacheKeepAliveNotice, { key: sessionKey, status: current }),
							),
						),
					),
				);
			}
			function assert(condition, message) {
				if (!condition) throw new Error(message);
			}
			async function settle() {
				await new Promise(requestAnimationFrame);
				await new Promise(requestAnimationFrame);
			}
			try {
				render("session-a");
				await settle();
				for (const id of views) {
					const view = document.getElementById(id);
					assert(
						view.textContent.includes("已保活，下次"),
						`${id}: concise status`,
					);
					assert(
						view.textContent.includes("累计 1 次 · 命中 99.8% · 约 $0.000323"),
						`${id}: concise usage`,
					);
					assert(
						view.scrollWidth <= view.clientWidth,
						`${id}: no horizontal overflow`,
					);
					const close = view.querySelector('button[aria-label="关闭"]');
					assert(close, `${id}: accessible close button`);
					if (matchMedia("(pointer: coarse)").matches)
						assert(
							close.getBoundingClientRect().width >= 44,
							`${id}: touch target`,
						);
				}
				document.querySelector("#desktop button").click();
				await settle();
				render("session-a", { ...status, requestCount: 2, reason: "warming" });
				await settle();
				assert(
					!document.querySelector("#desktop output"),
					"refresh must not reopen dismissed notice",
				);
				assert(
					document.querySelector("#webui-mobile output"),
					"dismissal is isolated per view",
				);
				document.querySelector("#webui-mobile button").click();
				await settle();
				render("session-a", null);
				await settle();
				render("session-a");
				await settle();
				assert(
					!document.querySelector("output"),
					"reconnect must not reopen dismissed notice",
				);
				render("session-b");
				await settle();
				assert(
					document.querySelectorAll("output").length === 2,
					"another session has its own notice",
				);
				document.body.dataset.testStatus = "passed";
				document.getElementById("results").textContent =
					"PASS: concise copy, dismissal, refresh, reconnect, session isolation and narrow layout";
			} catch (error) {
				document.body.dataset.testStatus = "failed";
				document.getElementById("results").textContent = error.stack;
				throw error;
			}
		</script>
	</body>
</html>
