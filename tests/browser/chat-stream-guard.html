<!doctype html>
<!-- Run with pnpm exec vite, then open /tests/browser/chat-stream-guard.html. -->
<html lang="en" translate="no">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Model stream guard regression</title>
	</head>
	<body>
		<pre id="results">Running…</pre>
		<div id="root"></div>
		<script type="module">
			import "../../src/index.css";
			import { createElement as h } from "react";
			import { createRoot } from "react-dom/client";
			import { AssistantMessage } from "../../src/components/chat/chat-message.tsx";
			import { ChatExpansionStateProvider } from "../../src/components/chat/chat-expansion-state.tsx";
			import { PreferencesProvider } from "../../src/lib/preferences-provider.tsx";
			import { TooltipProvider } from "../../src/ui/tooltip.tsx";
			import { i18n, initializeI18n } from "../../src/i18n/index.ts";

			await initializeI18n("en-US");
			const root = createRoot(document.getElementById("root"));
			function assert(condition, message) {
				if (!condition) throw new Error(message);
			}
			async function render(width, errorMessage) {
				root.render(
					h(
						PreferencesProvider,
						null,
						h(
							TooltipProvider,
							null,
							h(
								ChatExpansionStateProvider,
								null,
								h(
									"div",
									{ id: "viewport", style: { width, maxWidth: "100%" } },
									h(AssistantMessage, {
										message: {
											id: "stalled",
											role: "assistant",
											text: "Partial response is preserved.",
											time: "",
											streaming: false,
											stopReason: "error",
											errorMessage,
										},
									}),
								),
							),
						),
					),
				);
				// Markdown initializes asynchronously and may suspend the first commit.
				const expected = errorMessage.startsWith("PILO_STREAM_STALLED:")
					? i18n.t("chat.modelStreamStalled")
					: errorMessage;
				const deadline = performance.now() + 5000;
				while (
					document.querySelector('[role="alert"]')?.textContent !== expected
				) {
					assert(
						performance.now() < deadline,
						`alert did not settle: ${expected}`,
					);
					await new Promise(requestAnimationFrame);
				}
				await new Promise(requestAnimationFrame);
			}
			try {
				for (const language of ["en-US", "zh-CN"]) {
					await i18n.changeLanguage(language);
					for (const remote of [false, true]) {
						document.documentElement.toggleAttribute(
							"data-remote-webui",
							remote,
						);
						for (const width of [680, 320]) {
							for (const dark of [false, true]) {
								document.documentElement.classList.toggle("dark", dark);
								await render(
									width,
									"PILO_STREAM_STALLED: No model events for 120000 ms.",
								);
								assert(
									document.querySelector('[role="alert"]')?.textContent ===
										i18n.t("chat.modelStreamStalled"),
									"shared assistant must show a localized stalled-stream alert",
								);
								assert(
									!document.querySelector("[data-chat-streaming-status]"),
									"no stale processing indicator",
								);
								assert(
									document
										.getElementById("root")
										.textContent.includes("Partial response is preserved."),
									"partial response is retained",
								);
								const viewport = document.getElementById("viewport");
								assert(
									viewport.scrollWidth <= viewport.clientWidth,
									"no horizontal overflow on narrow screens",
								);
							}
						}
					}
				}
				await render(320, "provider rejected the request");
				assert(
					document.querySelector('[role="alert"]').textContent ===
						"provider rejected the request",
					"ordinary errors remain unchanged",
				);
				document.body.dataset.testStatus = "passed";
				document.getElementById("results").textContent =
					"PASS: localized stream failure, preserved partial response, cleared processing status, ordinary errors, desktop/WebUI, 320px and light/dark layouts.";
			} catch (error) {
				document.body.dataset.testStatus = "failed";
				document.getElementById("results").textContent = error.stack;
				throw error;
			}
		</script>
	</body>
</html>
