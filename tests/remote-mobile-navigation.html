<!doctype html>
<!-- Run with pnpm exec vite, then open at 320px, 390px and 768px viewport widths. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Mobile navigation regression</title>
	</head>
	<body>
		<div id="root"></div>
		<pre id="results">Running…</pre>
		<script type="module">
			import "../src/index.css";
			import { createElement, useState } from "react";
			import { createRoot } from "react-dom/client";
			import { RemoteMobileNavigation } from "../src/remote/remote-mobile-navigation.tsx";
			import { initializeI18n } from "../src/i18n/index.ts";

			const params = new URLSearchParams(location.search);
			await initializeI18n(params.get("locale") ?? "en-US");
			document.documentElement.classList.toggle("dark", params.has("dark"));
			const calls = [];
			const project = {
				id: "project",
				name: "Pilo workspace with a long project name",
				path: "/workspace/pilo",
				envId: "local",
				connectionType: "local",
			};
			const sessions = Array.from({ length: 52 }, (_, index) => ({
				id: `session-${index}`,
				title:
					index === 0
						? "Selected session with a long title"
						: `Session ${index}`,
				preview: null,
				sessionPath: `/workspace/session-${index}.jsonl`,
				projectId: project.id,
				latestMessageAt: new Date(2026, 0, 1, 0, 0, 52 - index),
				active: index === 1,
				unread: index === 2,
			}));
			function App() {
				const [open, setOpen] = useState(true);
				return createElement(
					"main",
					null,
					createElement(
						"button",
						{ id: "open", onClick: () => setOpen(true) },
						"Open navigation",
					),
					createElement(RemoteMobileNavigation, {
						client: null,
						open,
						onOpenChange: setOpen,
						envs: [{ id: "local", name: "Local environment" }],
						projects: [project],
						sessions,
						activeProjectId: project.id,
						selectedSessionId: sessions[0].id,
						connectionState: "connected",
						refreshingProjectIds: new Set(),
						onSelectSession: (...args) => calls.push(["select", ...args]),
						onNewChat: (...args) => calls.push(["new", ...args]),
						onRefreshProjectSessions: () => {},
						onDeleteSession: (...args) => calls.push(["delete", ...args]),
					}),
				);
			}
			createRoot(document.querySelector("#root")).render(createElement(App));
			const assert = (condition, message) => {
				if (!condition) throw new Error(message);
			};
			async function until(check) {
				const deadline = performance.now() + 5000;
				while (!check()) {
					if (performance.now() > deadline) throw new Error("Timed out");
					await new Promise(requestAnimationFrame);
				}
			}
			const dialog = () => document.querySelector('[role="dialog"]');
			async function settled() {
				await until(dialog);
				await Promise.all(
					dialog()
						.getAnimations()
						.map((animation) => animation.finished),
				);
			}
			async function reopen() {
				document.querySelector("#open").click();
				await settled();
			}
			try {
				await settled();
				const panel = dialog();
				const reducedMotion = matchMedia(
					"(prefers-reduced-motion: reduce)",
				).matches;
				if (!reducedMotion) {
					const style = getComputedStyle(panel);
					assert(
						style.animationName === "enter",
						"Missing drawer entrance animation",
					);
					assert(
						style.animationDuration === "0.18s",
						"Unexpected drawer animation duration",
					);
					assert(
						style.getPropertyValue("--tw-enter-translate-x").includes("-100%"),
						"Drawer does not slide in from the left edge",
					);
				}
				const rect = panel.getBoundingClientRect();
				assert(rect.width <= 320.5, "Drawer exceeds 320px");
				assert(
					innerWidth - rect.right >= 63.5,
					"Backdrop is narrower than 64px",
				);
				assert(
					panel.scrollWidth === panel.clientWidth,
					"Drawer overflows horizontally",
				);
				const env = panel.querySelector("button[aria-expanded]");
				const projectRow = panel.querySelectorAll("button[aria-expanded]")[1];
				const session = panel.querySelector("[data-session-row]");
				const newChat = panel.querySelector("header + div button");
				const footer = panel.querySelector("footer");
				const iconXs = [env, projectRow, newChat, footer].map(
					(row) => row.querySelector("svg").getBoundingClientRect().x,
				);
				assert(
					Math.max(...iconXs) - Math.min(...iconXs) < 1,
					"Leading icons are misaligned",
				);
				const labelXs = [
					env.children[1],
					projectRow.children[1],
					session.children[1],
					newChat.children[1],
					footer.children[1],
				].map((label) => label.getBoundingClientRect().x);
				assert(
					Math.max(...labelXs) - Math.min(...labelXs) < 1,
					"Labels are misaligned",
				);
				for (const button of panel.querySelectorAll("button")) {
					assert(
						button.getBoundingClientRect().height >= 44,
						"Touch target is shorter than 44px",
					);
				}
				assert(
					panel.contains(document.activeElement),
					"Dialog did not capture focus",
				);
				assert(
					panel.querySelector('[data-session-row][aria-current="page"]'),
					"Selected session cue is missing",
				);
				const modes = panel.querySelectorAll("button[aria-pressed]");
				modes[1].click();
				await until(() => modes[1].getAttribute("aria-pressed") === "true");
				assert(
					panel.querySelectorAll("[data-session-row]").length === 50,
					"Recent session limit changed",
				);
				modes[0].click();
				await until(() => panel.querySelector("button[aria-expanded]"));
				const firstSession = panel.querySelector("[data-session-row]");
				firstSession.dispatchEvent(
					new KeyboardEvent("keydown", {
						key: "F10",
						shiftKey: true,
						bubbles: true,
					}),
				);
				await until(
					() =>
						panel.querySelector('button[aria-label^="Delete:"]') ||
						panel.querySelector('button[aria-label^="删除:"]'),
				);
				assert(calls.length === 0, "Delete confirmation fired an action");
				assert(
					document.activeElement.textContent.match(/Cancel|取消/),
					"Delete cancellation did not receive focus",
				);
				document.activeElement.click();
				await until(
					() =>
						panel.querySelector("[data-session-row]") ===
						document.activeElement,
				);
				panel.querySelector("[data-session-row]").click();
				await until(() => !dialog());
				assert(calls[0]?.[0] === "select", "Session selection did not fire");
				await reopen();
				dialog().querySelector("header + div button").click();
				await until(() => !dialog());
				assert(calls[1]?.[0] === "new", "New session did not fire");
				await reopen();
				const closingPanel = dialog();
				closingPanel.dispatchEvent(
					new KeyboardEvent("keydown", { key: "Escape", bubbles: true }),
				);
				await until(() => closingPanel.dataset.state === "closed");
				if (!reducedMotion) {
					const style = getComputedStyle(closingPanel);
					assert(
						closingPanel.isConnected,
						"Drawer unmounted before its exit animation",
					);
					assert(
						style.animationName === "exit",
						"Missing drawer exit animation",
					);
					assert(
						style.animationDuration === "0.18s",
						"Exit duration does not match entrance",
					);
					assert(
						style.getPropertyValue("--tw-exit-translate-x").includes("-100%"),
						"Drawer does not slide back to the left edge",
					);
					assert(
						getComputedStyle(closingPanel.previousElementSibling)
							.animationDuration === style.animationDuration,
						"Backdrop animation is out of sync",
					);
				}
				await until(() => !dialog());
				await reopen();
				const outside = document.elementFromPoint(innerWidth - 16, 80);
				outside.dispatchEvent(
					new PointerEvent("pointerdown", {
						bubbles: true,
						pointerType: "mouse",
						button: 0,
					}),
				);
				outside.click();
				await until(() => !dialog());
				await reopen();
				document.body.dataset.testStatus = "passed";
				document.querySelector("#results").textContent =
					"Passed: width, backdrop, alignment, touch targets, focus, modes, delete cancellation, selection, new session, Escape and outside dismissal. Drawer left open for visual checks.";
			} catch (error) {
				document.body.dataset.testStatus = "failed";
				document.querySelector("#results").textContent = error.stack;
				throw error;
			}
		</script>
	</body>
</html>
